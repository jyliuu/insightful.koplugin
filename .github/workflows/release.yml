name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luajit zip unzip

      - name: Check the release version
        run: ./scripts/check-version.sh "$RELEASE_TAG"

      - name: Update the changelog and prepare release notes
        run: |
          ./scripts/update-changelog.sh "$RELEASE_TAG"
          if ! git diff --quiet -- CHANGELOG.md; then
            git diff -- CHANGELOG.md
            echo "::error::Commit the changelog entry before creating the release tag."
            exit 1
          fi
          ./scripts/changelog-section.sh "$RELEASE_TAG" > release-notes.md

      - name: Run tests and Lua syntax checks
        run: ./scripts/test.sh

      - name: Build the ZenPM compatible archive
        id: package
        run: |
          archive="$(./scripts/package.sh)"
          checksum="$archive.sha256"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$archive_sha" "${archive##*/}" > "$checksum"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -- \
            "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "Insightful $RELEASE_TAG"
          case "$RELEASE_TAG" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$@"
